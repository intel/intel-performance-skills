schema_version = "1.3"

[metadata]
skill = "performance-patterns"
author_name = "Nikolay Petrov"
author_email = "nikolay.a.petrov@intel.com"
difficulty = "hard"
difficulty_explanation = "A hand-written LSD radix sort is a solid 8-9x over std::sort; the bar is the throughput of a vectorized-partitioning quicksort with runtime dispatch (~20x on AVX-512), which must also be built into a self-contained static library because the grader has no network."
category = "performance"
tags = ["cpp", "sort", "simd", "avx512", "cpu-dispatch", "x86-simd-sort"]

[verifier]
timeout_sec = 900.0
network_mode = "no-network"

[agent]
timeout_sec = 1800.0
# The agent reaches its model API through the network; it may also fetch sources.
network_mode = "public"

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 4
memory_mb = 4096
storage_mb = 4096
gpus = 0
