schema_version = "1.3"

[metadata]
skill = "linux-perf"
author_name = "Nikolay Petrov"
author_email = "nikolay.a.petrov@intel.com"
difficulty = "medium"
difficulty_explanation = "A recorded perf c2c report with six hot lines: false sharing between parser- and flusher-owned stats fields, a shared atomic request counter with a minor read of a neighbouring field, a CAS spinlock word, and three lines below the 5% Tot Hitm threshold (one of them a textbook per-worker false-sharing layout with the most records). Calling the counter line false sharing because of the stray offset fails; listing sub-threshold lines and a spinlock fix other than test-and-test-and-set are recorded, not rewarded."
category = "performance"
tags = ["linux-perf", "perf-c2c", "false-sharing", "true-sharing", "hitm", "artifact-analysis"]

[verifier]
timeout_sec = 120.0
network_mode = "no-network"

[agent]
timeout_sec = 900.0
# The agent reaches its model API through the network; the task itself needs none.
network_mode = "public"

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 2048
gpus = 0
