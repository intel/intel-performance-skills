schema_version = "1.3"

# The report, kept with the trial so a reviewer can re-grade it.
artifacts = ["/app/hotspot_report.md"]

[metadata]
skill = "linux-perf"
author_name = "Nikolay Petrov"
author_email = "nikolay.a.petrov@intel.com"
difficulty = "medium"
difficulty_explanation = "Recorded perf stat, perf report, annotate and c2c for a solver whose top function is a scalar serial-accumulator dot product and whose second is a per-worker stats update that false-shares one cache line. The report must carry the top-functions table (its 5% cutoff is recorded, not required), per-function annotated source with within-function line percentages for both solver functions, and name the scalar, serial-accumulator and false-sharing patterns without claiming fixes."
category = "performance"
tags = ["linux-perf", "hotspot-report", "perf-annotate", "serial-accumulator", "false-sharing", "artifact-analysis"]

[verifier]
timeout_sec = 120.0
network_mode = "no-network"

[agent]
timeout_sec = 900.0
# The agent reaches its model API through the network; the task itself needs none.
network_mode = "public"

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 2048
gpus = 0
