schema_version = "1.3"

[metadata]
skill = "performance-patterns"
author_name = "Nikolay Petrov"
author_email = "nikolay.a.petrov@intel.com"
difficulty = "hard"
difficulty_explanation = "A correct hardware CRC32C is easy; the bar is the throughput of a VPCLMULQDQ folding implementation with runtime dispatch, which a single _mm_crc32_u64 chain (1x) or a 3-way interleave (~3x) does not reach."
category = "performance"
tags = ["c", "crc32c", "simd", "avx512", "vpclmulqdq", "cpu-dispatch"]

[verifier]
timeout_sec = 300.0
network_mode = "no-network"

[agent]
timeout_sec = 1800.0
# The agent reaches its model API through the network; the task itself needs none.
network_mode = "public"

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 4
memory_mb = 4096
storage_mb = 4096
gpus = 0
